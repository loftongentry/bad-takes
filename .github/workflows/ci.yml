# Checks every push to main and every pull request: formatting, lint, type-check, the backend's
# end-to-end tests (which play real games against the server and a Redis container), and the UI
# tests (which play games through the web build of the app in headless Chromium).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an in-progress run pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      # The root install skips scripts: its postinstall would re-install both halves
      - name: Install
        run: |
          npm ci --ignore-scripts
          npm ci --prefix backend
          npm ci --prefix frontend
          npm ci --prefix e2e

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: End-to-end tests
        run: npm --prefix backend run test:e2e

  ui:
    name: UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
          npm ci --prefix e2e

      - name: Install Chromium
        run: npx --prefix e2e playwright install --with-deps chromium

      # Builds the web app, starts a backend, and plays games in several browser windows
      - name: UI tests
        run: npm --prefix e2e test

      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14
